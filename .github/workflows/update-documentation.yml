name: Update project documentation

on:
  push:

permissions:
  contents: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh README and Obsidian vault
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repository snapshot
        run: python scripts/generate_project_docs.py

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- README.md vault/Project\ Snapshot.md; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md vault/Project\ Snapshot.md
          git commit -m "docs: refresh project snapshot"
          git push
